<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;height:100%;overflow:hidden;}
  .card{position:fixed;inset:0;border-radius:10px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;
    background:linear-gradient(160deg,#141a2e 0%,#1d1440 55%,#31104d 100%);
    animation:hue 24s linear infinite;}
  @keyframes hue{0%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(28deg)}100%{filter:hue-rotate(0deg)}}
  .time{font-family:Consolas,'Cascadia Mono',monospace;font-size:64px;font-weight:700;
    color:#eaf2ff;text-shadow:0 0 18px rgba(126,164,255,.75),0 0 46px rgba(126,164,255,.35);
    letter-spacing:2px;display:flex;align-items:baseline;}
  .colon{animation:blink 1s steps(1) infinite;color:#8fb0ff;}
  @keyframes blink{50%{opacity:.15}}
  .sec{font-size:22px;color:#9db8ff;margin-left:8px;opacity:.9;}
  .date{font-size:13px;color:#c9d6ff;opacity:.85;letter-spacing:3px;margin-top:4px;}
  .dot{width:9px;height:9px;border-radius:50%;background:#66ffa8;margin-top:14px;
    box-shadow:0 0 12px #66ffa8;animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{50%{transform:scale(1.65);opacity:.45}}
  .ring{position:absolute;width:230px;height:230px;border-radius:50%;
    border:1px solid rgba(140,170,255,.18);}
  .ring2{position:absolute;width:280px;height:280px;border-radius:50%;
    border:1px dashed rgba(140,170,255,.10);animation:spin 40s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style></head><body>
<div class="card">
  <div class="ring"></div><div class="ring2"></div>
  <div class="time"><span id="h">00</span><span class="colon">:</span><span id="m">00</span><span class="sec" id="s">00</span></div>
  <div class="date" id="date">—</div>
  <div class="dot"></div>
</div>
<script>
function two(n){return (n<10?'0':'')+n;}
var wd=['周日','周一','周二','周三','周四','周五','周六'];
function tick(){
  var d=new Date();
  document.getElementById('h').textContent=two(d.getHours());
  document.getElementById('m').textContent=two(d.getMinutes());
  document.getElementById('s').textContent=two(d.getSeconds());
  document.getElementById('date').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 · '+wd[d.getDay()];
}
tick(); setInterval(tick,250);
</script></body></html>
