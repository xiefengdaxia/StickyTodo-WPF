<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;height:100%;overflow:hidden;}
  .card{position:fixed;inset:0;border-radius:10px;box-sizing:border-box;padding:16px 20px;
    background:linear-gradient(165deg,#0d1f3c 0%,#10264a 60%,#14305f 100%);
    display:flex;flex-direction:column;}
  h1{margin:0;font-size:13px;color:#9fc2ff;letter-spacing:2px;}
  .sub{font-size:10.5px;color:#7189b8;margin:2px 0 12px;}
  .row{display:flex;align-items:center;gap:10px;padding:7px 0;
    border-bottom:1px solid rgba(255,255,255,.07);}
  .code{width:52px;font-family:Consolas,monospace;font-weight:700;color:#ffd75e;font-size:14px;}
  .name{flex:1;font-size:11.5px;color:#a9bce0;}
  .rate{font-family:Consolas,monospace;font-size:15px;color:#eaf2ff;
    text-shadow:0 0 10px rgba(126,164,255,.35);}
  .foot{margin-top:auto;text-align:right;font-size:10.5px;color:#7189b8;}
  .shine{height:3px;border-radius:2px;margin-top:8px;overflow:hidden;background:rgba(255,255,255,.07);}
  .shine div{height:100%;width:40%;background:linear-gradient(90deg,transparent,#7ec8ff,transparent);
    animation:move 3s linear infinite;}
  @keyframes move{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
</style></head><body>
<div class="card">
  <h1>汇率速览</h1>
  <div class="sub">1 USD = ? · open.er-api.com</div>
  <div id="rows"></div>
  <div class="shine"><div></div></div>
  <div class="foot" id="meta">等待采集器…</div>
</div>
<script>
var NAMES = { CNY:"人民币", EUR:"欧元", JPY:"日元", GBP:"英镑", HKD:"港元", KRW:"韩元" };
function render(d, at){
  var html = "";
  (d.rates||[]).forEach(function(r){
    html += '<div class="row"><span class="code">'+r.code+'</span><span class="name">'
      + (NAMES[r.code]||r.code) + '</span><span class="rate">'
      + (Math.round(r.rate*10000)/10000) + '</span></div>';
  });
  document.getElementById("rows").innerHTML = html;
  document.getElementById("meta").textContent = "更新于 " + (at||"") + " · 每 10 分钟";
}
if (window.chrome && window.chrome.webview) {
  window.chrome.webview.addEventListener("message", function(e){
    var m = e.data||{};
    if (m.type==="data") render(m.data, m.fetchedAt);
    else if (m.type==="error"){ document.getElementById("meta").textContent = m.message||""; }
    else if (m.type==="board"){ if(m.name) document.querySelector("h1").textContent = m.name; }
  });
}
</script></body></html>
