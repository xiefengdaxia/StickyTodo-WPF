<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;height:100%;overflow:hidden;}
  .card{position:fixed;inset:0;border-radius:10px;box-sizing:border-box;padding:20px 22px;
    background:linear-gradient(165deg,#2b1d12 0%,#33230f 55%,#3c2a12 100%);
    display:flex;flex-direction:column;justify-content:center;}
  .mark{font-size:44px;color:rgba(255,205,120,.35);font-family:Georgia,serif;line-height:.6;}
  .text{font-size:16.5px;line-height:1.7;color:#ffedd0;margin:8px 2px 14px;
    animation:fadein .9s ease both;}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .from{text-align:right;font-size:12px;color:#d8b878;}
  .from b{color:#ffd98a;}
  .foot{position:absolute;right:20px;bottom:12px;font-size:10px;color:#a48a5e;opacity:.8;}
</style></head><body>
<div class="card">
  <div class="mark">“</div>
  <div class="text" id="text">等待一言接口…</div>
  <div class="from" id="from"></div>
  <div class="foot" id="meta"></div>
</div>
<script>
function render(d, at){
  var t = document.getElementById("text");
  t.textContent = d.text || "";
  t.style.animation="none"; t.offsetHeight; t.style.animation="";
  document.getElementById("from").innerHTML = (d.who ? "<b>" + d.who + "</b>" : "") +
    (d.from ? "「" + d.from + "」" : "");
  document.getElementById("meta").textContent = "更新于 " + (at||"") + " · 每 10 分钟";
}
if (window.chrome && window.chrome.webview) {
  window.chrome.webview.addEventListener("message", function(e){
    var m = e.data||{};
    if (m.type==="data") render(m.data, m.fetchedAt);
    else if (m.type==="error"){ document.getElementById("meta").textContent = m.message||""; }
    else if (m.type==="board"){ }
  });
}
</script></body></html>
