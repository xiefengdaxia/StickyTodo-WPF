<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;height:100%;overflow:hidden;}
  .card{position:fixed;inset:0;border-radius:10px;box-sizing:border-box;padding:16px 20px;
    background:linear-gradient(160deg,#171b26 0%,#10131c 70%,#0d1117 100%);
    display:flex;flex-direction:column;}
  h1{margin:0 0 2px;font-size:12px;color:#8b98b8;letter-spacing:1px;}
  .repo{font-size:15px;color:#e6ecf7;font-weight:600;font-family:Consolas,monospace;margin-bottom:10px;}
  .hero{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
  .star{font-size:40px;filter:drop-shadow(0 0 14px rgba(255,200,60,.55));animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{50%{transform:scale(1.22);filter:drop-shadow(0 0 26px rgba(255,200,60,.9))}}
  .num{font-size:40px;font-weight:700;color:#ffd75e;font-family:Consolas,monospace;
    text-shadow:0 0 16px rgba(255,200,60,.4);}
  .num small{font-size:13px;color:#8b98b8;font-weight:400;margin-left:4px;}
  .grid{display:flex;gap:8px;}
  .cell{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);
    border-radius:8px;padding:8px 10px;}
  .cell .v{font-size:17px;font-weight:700;color:#cfe0ff;font-family:Consolas,monospace;}
  .cell .k{font-size:10.5px;color:#8b98b8;margin-top:1px;}
  .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;}
  .lang{font-size:11px;color:#7ee0ff;background:rgba(126,224,255,.12);border-radius:8px;padding:2px 9px;}
  .meta{font-size:10.5px;color:#697694;}
</style></head><body>
<div class="card">
  <h1>GITHUB REPO</h1>
  <div class="repo" id="repo">xiefengdaxia/StickyTodo-WPF</div>
  <div class="hero">
    <div class="star">⭐</div>
    <div class="num"><span id="stars">--</span><small>stars</small></div>
  </div>
  <div class="grid">
    <div class="cell"><div class="v" id="forks">--</div><div class="k">Forks</div></div>
    <div class="cell"><div class="v" id="issues">--</div><div class="k">Issues</div></div>
    <div class="cell"><div class="v" id="watch">--</div><div class="k">Watchers</div></div>
  </div>
  <div class="foot">
    <span class="lang" id="lang">—</span>
    <span class="meta" id="meta">等待采集器…</span>
  </div>
</div>
<script>
function render(d, at){
  document.getElementById("repo").textContent = d.name || "";
  document.getElementById("stars").textContent = d.stars;
  document.getElementById("forks").textContent = d.forks;
  document.getElementById("issues").textContent = d.issues;
  document.getElementById("watch").textContent = d.watchers;
  document.getElementById("lang").textContent = d.language || "—";
  document.getElementById("meta").textContent = "更新于 " + (at||"") + " · 每 5 分钟";
}
if (window.chrome && window.chrome.webview) {
  window.chrome.webview.addEventListener("message", function(e){
    var m = e.data||{};
    if (m.type==="data") render(m.data, m.fetchedAt);
    else if (m.type==="error"){ document.getElementById("meta").textContent = m.message||""; }
    else if (m.type==="board"){ if(m.name) document.querySelector("h1").textContent = m.name; }
  });
}
</script></body></html>
