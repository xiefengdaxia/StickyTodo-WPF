<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;height:100%;overflow:hidden;}
  .card{position:fixed;inset:0;border-radius:10px;box-sizing:border-box;padding:18px 20px 12px;
    background:linear-gradient(165deg,#0b2b2b 0%,#0d3a33 60%,#123f2e 100%);
    display:flex;flex-direction:column;gap:13px;}
  h1{margin:0;font-size:13px;color:#9ff0cf;letter-spacing:2px;font-weight:600;}
  .row{display:flex;flex-direction:column;gap:5px;}
  .label{display:flex;justify-content:space-between;font-size:12px;color:#cfeee0;}
  .label b{font-family:Consolas,monospace;color:#7bffc4;font-size:14px;}
  .bar{height:9px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;position:relative;}
  .fill{height:100%;border-radius:5px;width:0;transition:width 1.2s cubic-bezier(.22,1,.36,1);
    background:linear-gradient(90deg,#2fd08f,#7bffc4);position:relative;}
  .fill::after{content:"";position:absolute;inset:0;
    background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);
    animation:sweep 2.4s ease-in-out infinite;}
  @keyframes sweep{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
  .meta{margin-top:auto;font-size:10.5px;color:#9fd8c4;opacity:.7;text-align:right;}
</style></head><body>
<div class="card">
  <h1>今日进度</h1>
  <div class="row"><div class="label"><span>今天</span><b id="d">--%</b></div>
    <div class="bar"><div class="fill" id="dBar"></div></div></div>
  <div class="row"><div class="label"><span>本周</span><b id="w">--%</b></div>
    <div class="bar"><div class="fill" id="wBar"></div></div></div>
  <div class="row"><div class="label"><span>本月</span><b id="mo">--%</b></div>
    <div class="bar"><div class="fill" id="moBar"></div></div></div>
  <div class="row"><div class="label"><span>今年</span><b id="y">--%</b></div>
    <div class="bar"><div class="fill" id="yBar"></div></div></div>
  <div class="meta" id="meta">等待采集器…</div>
</div>
<script>
function setBar(id, v){ document.getElementById(id+"Bar").style.width = Math.max(0,Math.min(100,v)) + "%";
  document.getElementById(id).textContent = v.toFixed(1) + "%"; }
function render(data, at){
  setBar("d", data.day); setBar("w", data.week); setBar("mo", data.month); setBar("y", data.year);
  document.getElementById("meta").textContent = "更新于 " + (at||"") + " · 每 60 秒自动刷新";
}
if (window.chrome && window.chrome.webview) {
  window.chrome.webview.addEventListener("message", function(e){
    var m = e.data||{};
    if (m.type==="data") render(m.data, m.fetchedAt);
    else if (m.type==="error"){ document.getElementById("meta").textContent = m.message||""; }
    else if (m.type==="board"){ if(m.name) document.querySelector("h1").textContent = m.name; }
  });
}
</script></body></html>
